# Training configuration optimized for NVIDIA L40S (48 GB VRAM)

model:
  base_model: "BuzzASR/persian"
  dataset_name: "shekar-ai/Neyshekar"
  # Persistent-volume default on RunPod. Local runs without /workspace fall
  # back to outputs/buzzasr-neyshekar-lora automatically (see train_lora.py).
  # Override: --output_dir <path> or ASR_OUTPUT_DIR=<path>.
  output_dir: "/workspace/stt-outputs/buzzasr-neyshekar-lora"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "out_proj"
    - "fc1"
    - "fc2"

training:
  batch_size: 8
  grad_accum: 4           # Effective batch size = 32
  learning_rate: 1.0e-4
  epochs: 4
  warmup_steps: 500
  lr_scheduler_type: "cosine"
  eval_steps: 1000
  save_steps: 1000
  save_total_limit: 2
  precision: "bf16"
  optimizer: "adamw_torch_fused"
  gradient_checkpointing: false
  num_workers: 4
  eval_batch_size: 16
  max_benchmark_samples: 1000  # subset decoded twice: 1000 clean + same 1000 phone (2000 decodes); 0 = full test set (2149)
  preflight_samples: 1000      # mandatory measured baseline on the same rows; 0 = full test set (2149)
  # Telemetry/benchmark dir (loss_history, epoch_benchmarks, live_telemetry).
  # Persistent on RunPod; local runs without /workspace fall back to results/.
  results_dir: "/workspace/stt-outputs/results"

# Iranian telephony augmentation (measured customer channel).
# prob=0.5 means half the train samples are phone-simulated on-the-fly.
telephony:
  prob: 0.5
  profiles: ["customer"]
  seed: 42
  use_ffmpeg: true

benchmark:
  phone_benchmark: true   # dual clean + phone eval each epoch
  phone_seed: 1234
